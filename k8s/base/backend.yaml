apiVersion: apps/v1
kind: Deployment
metadata:
  name: resourceguard-backend
  namespace: resourceguard
  labels:
    app: resourceguard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resourceguard-backend
  template:
    metadata:
      labels:
        app: resourceguard-backend
    spec:
      serviceAccountName: resourceguard-backend
      containers:
        - name: backend
          image: resourceguard-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: resourceguard-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resourceguard-postgres-secret
                  key: database-url
          # resourceguard-postgres is a headless Service backing a
          # StatefulSet — DNS resolves once the pod is Ready.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resourceguard-backend
  namespace: resourceguard
spec:
  selector:
    app: resourceguard-backend
  ports:
    - port: 8000
      targetPort: 8000
