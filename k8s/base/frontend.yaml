apiVersion: apps/v1
kind: Deployment
metadata:
  name: resourceguard-frontend
  namespace: resourceguard
  labels:
    app: resourceguard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resourceguard-frontend
  template:
    metadata:
      labels:
        app: resourceguard-frontend
    spec:
      containers:
        - name: frontend
          image: resourceguard-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resourceguard-frontend
  namespace: resourceguard
spec:
  selector:
    app: resourceguard-frontend
  ports:
    - port: 80
      targetPort: 80
