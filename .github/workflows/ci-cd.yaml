name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/resourceguard-backend
  FRONTEND_IMAGE: ${{ github.repository }}/resourceguard-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # No "|| echo" fallback: a failing or missing test suite fails the
      # build. --cov-fail-under can be added once coverage is tracked.
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required for GitHub's OIDC token to be issued to this job.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The original workflow referenced AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY env vars directly on the `aws` CLI call with
      # no credential-provider step — that only works with a long-lived
      # static IAM key pair, which is exactly what you don't want sitting
      # in CI. This uses GitHub's OIDC provider to assume a short-lived
      # role instead: no stored AWS secret key exists at all. The role
      # must be pre-created in AWS with a trust policy scoped to this
      # repo (see docs/DEPLOYMENT.md) before this step will succeed.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name resourceguard-cluster --region ${{ vars.AWS_REGION }}

      - name: Helm upgrade
        run: |
          # The chart's default image.repository values are bare local
          # names (resourceguard-backend / resourceguard-frontend) for
          # kind/Minikube use. GHCR publishes under
          # ghcr.io/<owner>/<repo>/resourceguard-backend, which is a
          # different string — overriding only the tag (as the original
          # workflow did) left the repository at its local default, so
          # EKS tried to pull "resourceguard-backend:<sha>" from Docker
          # Hub and failed with ImagePullBackOff. Both repository and tag
          # must be set together.
          helm upgrade --install resourceguard ./helm/resourceguard \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set postgres.password=${{ secrets.POSTGRES_PASSWORD }} \
            --namespace resourceguard --create-namespace \
            --atomic --timeout 5m
