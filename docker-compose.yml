services:
  postgres:
    image: postgres:16-alpine
    container_name: resourceguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resourceguard
      POSTGRES_USER: resourceguard
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
