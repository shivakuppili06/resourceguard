server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In-cluster DNS name of the backend Service (see k8s/base/backend.yaml)
    location /api/ {
        proxy_pass http://resourceguard-backend:8000/api/;
        proxy_set_header Host $host;
    }
}
